name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - fresco/branding
      - develop

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Archive and export IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5
        with:
          persist-credentials: false

      - name: Setup build environment
        run: source ci_scripts/ci_common.sh && setup_github_actions_environment

      - name: Import Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::Set repository secrets BUILD_CERTIFICATE_BASE64, P12_PASSWORD, and KEYCHAIN_PASSWORD (Apple Development .p12)."
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Configure Fresco production build
        run: swift run -q tools ci configure-production

      - name: Archive ElementX
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          TEAM_ID="${DEVELOPMENT_TEAM:-7J4U792NQT}"
          ARCHIVE_PATH="$RUNNER_TEMP/ElementX.xcarchive"
          xcodebuild archive \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/ipa-export"
          TEAM_ID="${DEVELOPMENT_TEAM:-7J4U792NQT}"
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ci_scripts/ExportOptions-development.plist
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist ci_scripts/ExportOptions-development.plist \
            -allowProvisioningUpdates
          ls -la "$EXPORT_DIR"
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresco-ios-ipa-${{ github.sha }}
          path: ${{ env.EXPORT_DIR }}/*.ipa
          retention-days: 14
          if-no-files-found: error
